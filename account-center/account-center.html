<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulletin plans📌</title>
    <link rel="stylesheet" href="account-center.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Doppio+One&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Rubik:ital,wght@0,300..900;1,300..900&family=Space+Grotesk:wght@300..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <a href="../main-page/main-page.html" class="main-page"><svg xmlns="http://www.w3.org/2000/svg" height="30px"
                viewBox="0 -960 960 960" width="30px" fill="#3C3C3C">
                <path
                    d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z" />
            </svg></a>
        <p2 class="page-title">Bulletin plans📌</p2>
    </header>

    <div class="account-area">
        <div class="nav-bar">
            <div class="href-room">
                <a href="account-center.html" class="page current-page">Account center</a>
            </div>
            <div class="href-room">
                <a href="aha.html" class="page">Plans management</a>
            </div>
            <div class="href-room">
                <a href="../function-page/function-page.html" class="page">Workplace</a>
            </div>
        </div>
        <div class="account-info">
            <div class="avatar-container">
                <div class="avatar-frame">
                        <img class="avatar" src="">
                </div>
            <label for="input-avatar" class="avatar-selection">
                <p class="avatar-guide input-data">Click here to change avatar</p>
            </label>
            </div>
            <input type="file" accept="image/*" id="input-avatar" hidden>
            <div class="info-container">
                <h2 class="user-info">USER INFO</h2>
                <div>
                    <h3>Name:</h3>
                    <p class="name info">Nguyen Van A</p>
                    <input type="text" class="input-name input-data input-type">
                </div>
                <div>
                    <h3>Nationality:</h3>
                    <p class="nationality info">Vietnameses</p>
                    <input type="text" class="input-nationality input-data input-type">
                </div>
                <div>
                    <div>
                        <h3>Age:</h3>
                        <p class="age info">23</p>
                        <input type="number" class="input-age input-data input-type">
                    </div>
                    <div>
                        <h3>Gender:</h3>
                        <p class="gender info">Male</p>
                        <select class="gender-selection input-data input-type">
                            <option class="male">Male</option>
                            <option class="female">Female</option>
                            <option class="secret">Secret</option>
                         </select>   
                    </div>
                </div>
                <div>
                    <h3>Total plans:</h3>
                    <p class="total">4</p>
                </div>
            </div>
        </div>
    </div>
    <button class="log-out-btn">Log out</button>
    <button class="change-password-btn">Change password</button>
    <div class="change-password-area">
        <button class="close-p-area">X</button>
        <p class="password-changing-anouncement">Change password</p>
        <hr>
        <div><p class="old-password">Old password: </p><input type='password' class="input-old-password"></div>
        <div><p class="new-password">New password: </p><input type='password' class="input-new-password"></div>
        <div><p class="confirm-password">Confirm new password: </p><input type='password' class="input-confirm-password"></div>
        <button class="confirm-change p-btn">Confirm</button> <button class="reset-password p-btn">Reset</button>
    </div>
    <button class="adjust-btn">Edit account</button>
    <button class="finish-btn">Finish</button>
    <div class="recheck">
        <p class="recheck-anounce">Are you sure with these changes ?</p>
        <div class="btn-recheck">
            <button class="recheck-btn btn">Wait, let me recheck</button>
            <button class="guarantee-btn btn">Okay, I'm sure</button>
        </div>
    </div>



    <script type="module" src="account-center.js"></script>
</body>

</html>

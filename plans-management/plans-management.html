<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="plans-management.css">

<body>
    <header>
        <a href="../main-page/main-page.html" class="main-page"><svg xmlns="http://www.w3.org/2000/svg" height="30px"
                viewBox="0 -960 960 960" width="30px" fill="#3C3C3C">
                <path
                    d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z" />
            </svg></a>
        <p2 class="page-title">Bulletin plans📌</p2>
    </header>

    <div class="management-area">
        <div class="nav-bar">
            <div class="href-room">
                <a href="../account-center/account-center.html" class="page">Account center</a>
            </div>
            <div class="href-room">
                <a href="../plans-management/plans-management.html" class="page  current-page">Plans management</a>
            </div>
            <div class="href-room">
                <a href="../select-workplace/select-workplace.html" class="page">Workplace</a>
            </div>
        </div>
        <div class="plans-management">
            <div class="searching-tool">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="gray">
                    <path
                        d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
                </svg>
                <input type="text" class="keywords" placeholder="Enter your wanted project's name">
            </div>
            <div class="plans-container">
            </div>
        </div>
    </div>
    <div class="menu-activities">
        <div class = plan-name>
            <p class="menu-name"></p>
        </div>
        <hr>
        <div class="open-plan">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#3C3C3C">
                <path
                    d="M395-115q-35-35-35-85t35-85q35-35 85-35t85 35q35 35 35 85t-35 85q-35 35-85 35t-85-35Zm85-285L280-600l56-56 104 103v-327h80v327l103-103 57 56-200 200Z" />
            </svg>
            <span>
                <p>Open</p>
            </span>
        </div>
        <div class="view-plan">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#3C3C3C">
                <path
                    d="M607.5-372.5Q660-425 660-500t-52.5-127.5Q555-680 480-680t-127.5 52.5Q300-575 300-500t52.5 127.5Q405-320 480-320t127.5-52.5Zm-204-51Q372-455 372-500t31.5-76.5Q435-608 480-608t76.5 31.5Q588-545 588-500t-31.5 76.5Q525-392 480-392t-76.5-31.5ZM214-281.5Q94-363 40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200q-146 0-266-81.5ZM480-500Zm207.5 160.5Q782-399 832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280q113 0 207.5-59.5Z" />
            </svg> <span>
                <p>View information</p>
            </span>
        </div>
        <div class="edit-plan">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#3C3C3C">
                <path
                    d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z" />
            </svg> <span>
                <p>Edit info</p>
            </span>
        </div>
        <div class="delete-plan">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#3C3C3C">
                <path
                    d="m376-300 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 180q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520Zm-400 0v520-520Z" />
            </svg> <span>
                <p>Delete</p>
            </span>
        </div>
    </div>
    <div class="view">
        <div class="info">
        <div class="dates-container">
            <div class="created-info">
                <h3>Created: </h3>
                <p class="created-date"></p>
            </div>
            <div class="updated-info">
                <h3>Updated: </h3>
                <p class="updated-date"></p>
            </div>
        </div>
        <div class="name-container">
            <h3>Plan's name: </h3>
            <p class="name">Error</p>
        </div>
        <div class="desc-container">
            <h3>Description: </h3>
            <p class="desc">Error</p>
        </div>
        </div>
        <div class="edit">
            <div class ='edit-name'>
                <h3>Plan's name: </h3>
                <input type="text" class="input-name">
            </div>
            <div class = 'edit-desc'>
                <h3>Description: </h3>
                <textarea class="input-desc" style="resize: none;"> </textarea>
            </div>
            <div class="btn-container">
                <button class="reset btn">Reset</button>
                <button class="confirm btn">Confirm</button>
            </div>
        </div>
        <div class="delete">
            <p class="question">Are you sure to delete this plan ?</p>
            <p class="plan-Name">->Plan's name:</p>
            <div class="choices">
                <p class="no">No</p>
                <p class="yes">Yes</p>
            </div>
        </div>
    <button class="close">X</button>
    
    </div>
    <script type="module" src="plans-management.js"></script>
</body>

</html>
